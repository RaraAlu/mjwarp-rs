<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mjwarp-rs · 开发排程总览</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header>
    <div><div class="eyebrow">MJWARP-RS / DEVELOPMENT</div><h1>开发排程总览</h1><p>三层迁移 × 产品路线 × 交付证据</p></div>
    <div class="sync"><button id="refresh">刷新原排程</button><label><input id="auto" type="checkbox" checked>每分钟刷新</label><div id="sync-status" role="status">正在连接只读服务…</div></div>
  </header>
  <div id="notice" role="alert" hidden></div>
  <div class="boundary">只读来源：原排程（Normify）。完成登记不等于产品验收。计数不表示产品完成率。</div>
  <section id="metrics" aria-label="全局任务计数"></section>
  <nav aria-label="总览导航">
    <button data-view="overview" class="active">关联总览</button>
    <button data-view="all">全部任务</button>
    <button data-view="queue">执行队列</button>
    <button data-view="history">完成与历史</button>
    <span id="head"></span>
  </nav>
  <div class="workspace"><main id="main"><p>正在读取全项目任务…</p></main><aside id="detail" aria-label="任务详情"><p>点击任务，查看真实依赖。</p></aside></div>
  <footer>分组只帮助阅读，不新增前置。排程不承诺日期。资源冲突仍须独立核对。</footer>
</body>
</html>
