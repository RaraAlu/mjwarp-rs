[package]
name = "mjwarp-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda-probe = ["dep:cudarc", "dep:serde", "dep:serde_json", "dep:sha2"]
cubecl-cpp-probe = ["cuda-probe", "dep:cubecl-core", "dep:cubecl-cpp"]
cubecl-llvm-probe = ["cuda-probe", "dep:cubecl-core", "dep:cubecl-llvm"]
native-model-probe = ["dep:cc"]

[build-dependencies]
cc = { version = "=1.6.0", optional = true }

[dependencies]
serde = { version = "=1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "=1.0.151", optional = true }
sha2 = { version = "=0.10.9", optional = true }
cudarc = { version = "=0.18.2", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }
cubecl-core = { git = "https://github.com/tracel-ai/cubecl.git", rev = "1f73b9f63de50a17398c1d5278e2a5f11612c7e1", optional = true, default-features = false, features = ["std", "nvidia"] }
cubecl-cpp = { git = "https://github.com/tracel-ai/cubecl.git", rev = "1f73b9f63de50a17398c1d5278e2a5f11612c7e1", optional = true, default-features = false, features = ["std", "cuda"] }
cubecl-llvm = { git = "https://github.com/tracel-ai/cubecl.git", rev = "1f73b9f63de50a17398c1d5278e2a5f11612c7e1", optional = true, default-features = false, features = ["std", "nvptx"] }
