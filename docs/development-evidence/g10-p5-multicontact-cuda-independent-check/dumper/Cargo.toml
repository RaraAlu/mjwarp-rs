[package]
name = "qa-multicontact-dumper"
version = "0.1.0"
edition = "2021"

# 独立于仓库 workspace 的 QA harness：只通过公开 API（`CollisionGpuProgram`）使用产品
# NVRTC 入口跑 multicontact / boxbox / 既有 launcher 回归 case，把原始输出落盘，
# 供 QA 自己的 Python 比较器逐字节对照上游 f32 GPU 参考 / G5 探针 out1。
[workspace]

[dependencies]
mjwarp-rs = { path = "../../../..", features = ["cuda-probe"] }
