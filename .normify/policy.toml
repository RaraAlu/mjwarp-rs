[[rules]]
id = "core-acyclic"
include_cross_tree = true
severity = "error"
type = "acyclic"

[[rules]]
from = ["**"]
id = "core-no-deprecated-target"
severity = "warning"
to = ["**"]
to_state = "deprecated"
type = "forbid-dependency"

[[rules]]
from = ["mjwarp.io", "mjwarp.io.**"]
id = "boundary-io"
severity = "error"
to = ["mjwarp.render", "mjwarp.render.**"]
type = "forbid-dependency"

[[rules]]
from = ["mjwarp.physics", "mjwarp.physics.**"]
id = "boundary-physics"
severity = "error"
to = ["mjwarp.io", "mjwarp.io.**", "mjwarp.render", "mjwarp.render.**"]
type = "forbid-dependency"

[[rules]]
from = ["mjwarp.render", "mjwarp.render.**"]
id = "boundary-render"
severity = "error"
to = ["mjwarp.io", "mjwarp.io.**", "mjwarp.physics", "mjwarp.physics.**"]
type = "forbid-dependency"

[[rules]]
from = ["mjwarp.model", "mjwarp.model.**"]
id = "boundary-model"
severity = "error"
to = ["mjwarp.io", "mjwarp.io.**", "mjwarp.physics", "mjwarp.physics.**", "mjwarp.render", "mjwarp.render.**"]
type = "forbid-dependency"

[[rules]]
from = ["mjwarp.runtime", "mjwarp.runtime.**"]
id = "boundary-runtime"
severity = "error"
to = ["mjwarp.io", "mjwarp.io.**", "mjwarp.physics", "mjwarp.physics.**", "mjwarp.render", "mjwarp.render.**", "mjwarp.model", "mjwarp.model.**", "mjwarp.math", "mjwarp.math.**"]
type = "forbid-dependency"

[[rules]]
from = ["mjwarp.math", "mjwarp.math.**"]
id = "boundary-math"
severity = "error"
to = ["mjwarp.io", "mjwarp.io.**", "mjwarp.physics", "mjwarp.physics.**", "mjwarp.render", "mjwarp.render.**", "mjwarp.model", "mjwarp.model.**", "mjwarp.runtime", "mjwarp.runtime.**"]
type = "forbid-dependency"

[[rules]]
from = ["mjwarp.diagnostics", "mjwarp.diagnostics.**"]
id = "boundary-diagnostics"
severity = "error"
to = ["mjwarp.io", "mjwarp.io.**", "mjwarp.physics", "mjwarp.physics.**", "mjwarp.render", "mjwarp.render.**", "mjwarp.model", "mjwarp.model.**", "mjwarp.runtime", "mjwarp.runtime.**", "mjwarp.math", "mjwarp.math.**"]
type = "forbid-dependency"

[[rules]]
id = "no-cross-tree"
mode = "forbid"
severity = "error"
type = "cross-tree"

[[rules]]
id = "depth-budget"
max_depth = 12
severity = "error"
type = "max-depth"

[[rules]]
first = "a-z"
id = "module-names"
rest = "a-z0-9-"
severity = "error"
type = "naming"
